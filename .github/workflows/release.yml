name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version to publish (for example, 0.1.0). Leave empty for a build only.'
        required: false
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build jar
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "$RELEASE_VERSION" ]]; then
            VERSION="$RELEASE_VERSION"
          else
            VERSION="0.0.0-${GITHUB_SHA::7}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          ./gradlew clean bootJar -PreleaseVersion="$VERSION"

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dev-data-api-${{ env.VERSION }}
          path: build/libs/dev-data-api-${{ env.VERSION }}.jar
          if-no-files-found: error

      - name: Upload jar to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_version != '')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/dev-data-api-${{ env.VERSION }}.jar
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', inputs.release_version) }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
